<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FiruWalk Paseador</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #fff; color: #1f2937; text-align: center; padding: 24px; box-sizing: border-box; }
      button { margin-top: 16px; padding: 12px 24px; border-radius: 999px; border: 0; background: #16a34a; color: #fff; font-weight: 700; font-size: 16px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Sin conexión 🐾</h1>
      <p>No pudimos abrir FiruWalk. Revisa tus datos o Wi-Fi.</p>
      <p>Si estás en un paseo, tu recorrido se guarda en el teléfono y se enviará al reconectar.</p>
      <button onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>

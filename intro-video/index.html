<!doctype html>
<html
  lang="en"
  data-composition-variables='[{"id":"brand","type":"string","label":"Brand name","default":"FiruWalk"},{"id":"tagline","type":"string","label":"Tagline","default":"Santa Cruz · Bolivia"}]'
>
  <head>
    <meta charset="utf-8" />
    <title>FiruWalk — intro splash (2.4s, 1920x1080, silent)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      #root {
        position: absolute;
        inset: 0;
        /* darkest brand green (app dark-mode --primary-foreground, oklch(0.2 0.04 152)) */
        background: #061b0c;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="2.4"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="intro"
        data-composition-id="intro"
        data-composition-src="compositions/intro.html"
        data-start="0"
        data-duration="2.4"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
